<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenECC">
  <title>OpenECC</title>
  <rect width="64" height="64" rx="14" fill="#12324a"/>
  <!-- open ring shaped like a C (the opening faces right) -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#9fb3c8" stroke-width="2.5" stroke-dasharray="104 28" transform="rotate(38 32 32)"/>
  <!-- the ECC at the centre, linked to the people and places it supports -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <path d="M32 32V15M32 32H49M32 32V49M32 32H15"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="15" r="4"/>
    <circle cx="49" cy="32" r="4"/>
    <circle cx="32" cy="49" r="4"/>
    <circle cx="15" cy="32" r="4"/>
  </g>
  <circle cx="32" cy="32" r="7.5" fill="#f0a43a"/>
</svg>

#### OpenECC appliance: answers for the Debian 13 installer (preseed).
# build_iso.sh fills in the @...@ values and puts this file at the top of the ISO (/preseed.cfg).
# The only question left for the person installing: confirming which disk gets erased.

### Language, keyboard, network
d-i debian-installer/locale string en_CA.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string CA
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string openecc
d-i netcfg/get_domain string
d-i netcfg/hostname string openecc
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Where packages come from (needs internet during the install)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

### Accounts: no root login; the "openecc" user can use sudo
d-i passwd/root-login boolean false
d-i passwd/user-fullname string OpenECC
d-i passwd/username string openecc
d-i passwd/user-password-crypted password @USER_PASSWORD_HASH@

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string @TIMEZONE@
d-i clock-setup/ntp boolean true

### Disk
# Use the first NVMe drive if there is one (a USB stick is never NVMe). With no NVMe drive the
# installer asks which disk to use.
d-i partman/early_command string DISK="$(list-devices disk | grep '/dev/nvme' | head -n1)"; if [ -n "$DISK" ]; then debconf-set partman-auto/disk "$DISK"; fi; true
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman-efi/non_efi_system boolean true
# Deliberately NOT answered: partman/confirm and partman/confirm_nooverwrite. The installer shows
# which disk it is about to erase and waits for "Yes".

### Software
tasksel tasksel/first multiselect @TASKS@
d-i pkgsel/include string @PACKAGES@
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### OpenECC: copy the files from the USB stick and switch on setup mode
d-i preseed/late_command string cp -a /cdrom/openecc /target/opt/openecc-src && in-target bash /opt/openecc-src/openecc/appliance/setup_mode.sh --installer

### Finish without the "installation complete" screen; take out the USB stick when it restarts
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
